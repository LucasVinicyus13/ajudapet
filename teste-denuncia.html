<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Denúncia - AjudaPet</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 2rem; max-width: 800px; margin: 0 auto; }
        pre { background: #f0f0f0; padding: 1rem; border-radius: 8px; overflow-x: auto; }
        button { background: #FF6B35; color: white; padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #ff5520; }
        .success { color: green; }
        .error { color: red; }
        .warning { color: orange; }
    </style>
</head>
<body>
    <h1>🔍 Teste de Denúncia</h1>
    <button onclick="testarDenuncia()">Testar Denúncia Agora</button>
    <pre id="output"></pre>

    <script type="module">
        // Importar Firebase diretamente
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBZ53kYtTFaToHGhkAnEQ6sN2yF5jABb98",
            authDomain: "ajudapet-2d3c6.firebaseapp.com",
            projectId: "ajudapet-2d3c6",
            storageBucket: "ajudapet-2d3c6.firebasestorage.app",
            messagingSenderId: "876154081954",
            appId: "1:876154081954:web:35340b11e004e8a449bdfb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        window.testarDenuncia = async function() {
            const output = document.getElementById('output');
            output.innerHTML = '<span class="warning">⏳ Testando...</span>\n';

            function log(msg, type = 'info') {
                const timestamp = new Date().toLocaleTimeString();
                const prefix = {
                    'error': '❌',
                    'success': '✅',
                    'warning': '⚠️'
                }[type] || 'ℹ️';

                const line = `[${timestamp}] ${prefix} ${msg}`;
                output.innerHTML += `<span class="${type}">${line}</span>\n`;
                console.log(line);
            }

            // Verificar autenticação
            if (!auth.currentUser) {
                log('Você não está autenticado!', 'error');
                log('Faça login na aplicação primeiro.', 'warning');
                return;
            }

            log(`Usuário: ${auth.currentUser.email}`, 'success');
            log(`UID: ${auth.currentUser.uid}`, 'info');

            try {
                log('Tentando criar documento em /reports/...', 'info');

                const docRef = await addDoc(collection(db, 'reports'), {
                    petId: `test-${Date.now()}`,
                    petName: 'Teste',
                    reporterName: auth.currentUser.displayName || auth.currentUser.email,
                    reporterEmail: auth.currentUser.email,
                    motivo: 'Teste automático - ignore',
                    ownerIdentifier: 'teste',
                    dataCriacao: serverTimestamp(),
                    resolvida: false
                });

                log(`✅ SUCESSO! Documento criado: ${docRef.id}`, 'success');
                log('As regras do Firestore estão corretas!', 'success');

            } catch (error) {
                log(`Erro: ${error.code}`, 'error');
                log(`Mensagem: ${error.message}`, 'error');

                if (error.message.includes('permission')) {
                    log('', 'info');
                    log('🔴 PROBLEMA: Permissões insuficientes no Firestore', 'error');
                    log('', 'info');
                    log('SOLUÇÃO:', 'warning');
                    log('1. Abra: https://console.firebase.google.com', 'warning');
                    log('2. Projeto: ajudapet-2d3c6', 'warning');
                    log('3. Vá para: Firestore Database > Regras', 'warning');
                    log('4. Copie e cole as regras de CONFIGURACAO_FIREBASE.md', 'warning');
                    log('5. Clique em PUBLICAR (não é Draft!)', 'warning');
                    log('6. Aguarde 30 segundos', 'warning');
                    log('7. Volte aqui e tente novamente', 'warning');
                } else {
                    log('Verifique o Firebase Console para mais detalhes', 'warning');
                }
            }
        };

        // Verificar se está autenticado ao carregar
        onAuthStateChanged(auth, (user) => {
            const output = document.getElementById('output');
            if (user) {
                output.innerHTML = `<span class="success">✅ Autenticado como: ${user.email}</span>\nClique no botão para testar!`;
            } else {
                output.innerHTML = '<span class="error">❌ Você não está autenticado.\n\nFaça login na aplicação primeiro, depois volte aqui.</span>';
            }
        });
    </script>
</body>
</html>
