<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar post - AjudaPet</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">
    <header class="app-header">
        <div class="container">
            <h1 id="app-logo">Ajuda<span>Pet</span></h1>
        </div>
    </header>

    <main class="container profile-page">
        <section class="profile-card" id="verification-card">
            <div class="profile-empty">Carregando post...</div>
        </section>
    </main>

    <script type="module">
        import { auth, observeAuthState, buscarPetPorId, atualizarPet, deletarPet } from '../js/firebase-config.js';
        import { isAdminEmail } from '../js/pet-utils.js';

        const params = new URLSearchParams(window.location.search);
        const petId = params.get('id');
        const container = document.getElementById('verification-card');

        function redirectHome() {
            window.location.href = '../index.html';
        }

        observeAuthState((user) => {
            if (!user) {
                redirectHome();
                return;
            }

            if (!isAdminEmail(user.email)) {
                redirectHome();
                return;
            }

            if (!petId) {
                container.innerHTML = '<div class="profile-empty">Post não encontrado.</div>';
                return;
            }

            loadPet(petId);
        });

        async function loadPet(id) {
            try {
                const pet = await buscarPetPorId(id);
                if (!pet) {
                    container.innerHTML = '<div class="profile-empty">Post não encontrado.</div>';
                    return;
                }

                container.innerHTML = `
                    <img src="${pet.imagem || '../assets/images/placeholder.svg'}" alt="${pet.nome}" class="profile-avatar-large" style="width: 100%; max-width: 320px; height: auto; border-radius: 24px; display: block; margin: 0 auto 1.5rem;">
                    <h2>${pet.nome}</h2>
                    <p><strong>Cidade:</strong> ${pet.cidade || '-'}</p>
                    <p><strong>Status:</strong> ${pet.status || '-'}</p>
                    <p><strong>Contato:</strong> ${pet.contato || pet.telefone || '-'}</p>
                    <p><strong>Descrição:</strong> ${pet.descricao || '-'}</p>
                    <p><strong>Categoria:</strong> ${(pet.categoria || []).join(', ') || '-'}</p>
                    <div class="profile-action" style="margin-top: 1.5rem;">
                        <button type="button" id="allow-post" class="btn-submit btn-avatar-primary">Permitir</button>
                        <button type="button" id="delete-post" class="btn-submit btn-avatar-secondary">Excluir post</button>
                    </div>
                `;

                document.getElementById('allow-post').addEventListener('click', async () => {
                    await atualizarPet(id, { status: pet.status || 'resgate', aprovado: true });
                    alert('Post permitido.');
                    window.location.reload();
                });

                document.getElementById('delete-post').addEventListener('click', async () => {
                    if (!confirm('Deseja excluir este post?')) return;
                    await deletarPet(id);
                    alert('Post excluído.');
                    redirectHome();
                });
            } catch (error) {
                console.error('Erro ao carregar post:', error);
                container.innerHTML = '<div class="profile-empty">Não foi possível carregar este post.</div>';
            }
        }
    </script>
</body>
</html>
