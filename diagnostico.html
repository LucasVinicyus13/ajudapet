<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico - AjudaPet Denúncias</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f0f4f8;
            padding: 2rem;
            line-height: 1.6;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #004e64;
            margin-bottom: 1rem;
            font-size: 1.8rem;
        }

        .status {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .status.loading {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status.success {
            background: #e8f5e9;
            color: #388e3c;
        }

        .status.error {
            background: #ffebee;
            color: #c62828;
        }

        .status.warning {
            background: #fff3e0;
            color: #f57c00;
        }

        .log-box {
            background: #263238;
            color: #00ff00;
            padding: 1rem;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 1rem;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .log-item {
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }

        .log-error {
            color: #ff6b6b;
        }

        .log-success {
            color: #51cf66;
        }

        .log-info {
            color: #74c0fc;
        }

        .log-warning {
            color: #ffd43b;
        }

        button {
            background: linear-gradient(180deg, #FF8A4B, #FF6B35);
            color: white;
            border: none;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            margin-right: 0.5rem;
            font-size: 0.95rem;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 107, 53, 0.3);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .section {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #e0e0e0;
        }

        .checklist {
            list-style: none;
        }

        .checklist li {
            padding: 0.5rem 0;
            display: flex;
            align-items: center;
        }

        .checklist li::before {
            content: "□ ";
            margin-right: 0.5rem;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .checklist li.done::before {
            content: "✅ ";
        }

        .checklist li.error::before {
            content: "❌ ";
        }

        code {
            background: #f5f5f5;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9rem;
        }

        .tip {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 1rem;
            margin-top: 1rem;
            border-radius: 4px;
        }

        .tip strong {
            color: #2e7d32;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Diagnóstico - Sistema de Denúncias</h1>

        <div id="status" class="status loading">
            ⏳ Carregando diagnóstico...
        </div>

        <div class="log-box" id="logBox"></div>

        <div class="actions">
            <button onclick="runDiagnostics()">🔄 Executar Diagnóstico</button>
            <button onclick="clearLog()">🗑️ Limpar Log</button>
        </div>

        <div class="section">
            <h3>✓ Checklist</h3>
            <ul class="checklist" id="checklist">
                <li id="check-auth">Autenticação</li>
                <li id="check-firebase">Firebase Inicializado</li>
                <li id="check-rules">Regras Firestore</li>
                <li id="check-collection">Coleção Reports</li>
            </ul>
        </div>

        <div class="section">
            <h3>🚀 Ações</h3>
            <button onclick="testReport()">📨 Testar Criar Denúncia</button>
            <button onclick="checkFirebaseRules()">📋 Verificar Regras</button>
            <button onclick="openFirebaseConsole()">🌐 Abrir Firebase Console</button>
        </div>

        <div class="tip">
            <strong>💡 Dica:</strong> Se o teste falhar, copie o log de erro e compare com as soluções em <code>GUIA_ERROS_DENUNCIA.md</code>
        </div>
    </div>

    <script type="module">
        import { auth, db, criarDenuncia, observeAuthState } from './js/firebase-config.js';
        import { isAdminEmail } from './js/pet-utils.js';

        window.logMessages = [];

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString('pt-BR');
            const prefix = {
                'error': '❌',
                'success': '✅',
                'info': 'ℹ️',
                'warning': '⚠️'
            }[type] || 'ℹ️';

            const logItem = `[${timestamp}] ${prefix} ${message}`;
            window.logMessages.push(logItem);

            const logBox = document.getElementById('logBox');
            if (logBox) {
                const div = document.createElement('div');
                div.className = `log-item log-${type}`;
                div.textContent = logItem;
                logBox.appendChild(div);
                logBox.scrollTop = logBox.scrollHeight;
            }

            console.log(logItem);
        }

        function clearLog() {
            window.logMessages = [];
            const logBox = document.getElementById('logBox');
            if (logBox) logBox.innerHTML = '';
        }

        function updateStatus(message, type) {
            const statusEl = document.getElementById('status');
            if (statusEl) {
                statusEl.textContent = message;
                statusEl.className = `status ${type}`;
            }
        }

        function updateChecklist(id, status) {
            const el = document.getElementById(id);
            if (el) {
                el.className = status ? 'done' : 'error';
            }
        }

        async function runDiagnostics() {
            clearLog();
            updateStatus('⏳ Executando diagnóstico...', 'loading');
            log('=== DIAGNÓSTICO DE DENÚNCIAS ===', 'info');

            try {
                // 1. Verificar autenticação
                log('1. Verificando autenticação...', 'info');
                const user = auth.currentUser;

                if (!user) {
                    log('❌ Você não está autenticado!', 'error');
                    log('   → Faça login na aplicação primeiro', 'warning');
                    updateChecklist('check-auth', false);
                    updateStatus('❌ Erro: Usuário não autenticado', 'error');
                    return;
                }

                log(`✅ Autenticado como: ${user.email}`, 'success');
                log(`   UID: ${user.uid}`, 'info');
                updateChecklist('check-auth', true);

                // 2. Verificar Firebase
                log('\n2. Verificando Firebase...', 'info');
                if (!db) {
                    log('❌ Firebase Firestore não está inicializado', 'error');
                    updateChecklist('check-firebase', false);
                    updateStatus('❌ Firebase não está configurado', 'error');
                    return;
                }
                log('✅ Firebase Firestore inicializado', 'success');
                updateChecklist('check-firebase', true);

                // 3. Verificar Regras
                log('\n3. Verificando regras do Firestore...', 'info');
                log('   → As regras devem permitir: create para reports', 'info');
                log('   → Você pode ver as regras no Firebase Console', 'info');

                // 4. Verificar se pode criar doc na coleção reports
                log('\n4. Testando acesso à coleção reports...', 'info');

                const testData = {
                    petId: `test-${Date.now()}`,
                    petName: 'Teste',
                    reporterName: user.displayName || user.email,
                    reporterEmail: user.email,
                    motivo: 'Teste automático - Por favor, ignore',
                    ownerIdentifier: 'teste'
                };

                try {
                    log(`   Tentando criar documento em /reports/...`, 'info');
                    const reportId = await criarDenuncia(testData);
                    log(`✅ Sucesso! Documento criado: ${reportId}`, 'success');
                    log('   ✅ As regras do Firestore estão corretas!', 'success');
                    updateChecklist('check-collection', true);
                    updateStatus('✅ Tudo está funcionando!', 'success');

                } catch (error) {
                    log(`❌ Erro ao criar documento:`, 'error');
                    log(`   Código: ${error.code}`, 'error');
                    log(`   Mensagem: ${error.message}`, 'error');
                    updateChecklist('check-collection', false);

                    if (error.message.includes('permission')) {
                        log('\n🔴 PROBLEMA: Permissões insuficientes', 'error');
                        log('   → Você precisa atualizar as regras do Firestore', 'warning');
                        log('   → Vá para Firebase Console > Firestore > Regras', 'warning');
                        log('   → Cole as regras do arquivo CONFIGURACAO_FIREBASE.md', 'warning');
                        log('   → Clique em "Publicar"', 'warning');
                        updateStatus('❌ Erro de permissões - Veja solução acima', 'error');
                    } else if (error.message.includes('not-found')) {
                        log('\n🟡 PROBLEMA: Coleção reports pode não existir', 'warning');
                        log('   → O Firestore criará a coleção automaticamente', 'info');
                        log('   → Mas você precisa das regras corretas', 'warning');
                        updateStatus('⚠️ Verifique as regras do Firestore', 'warning');
                    } else {
                        log('\n❓ Erro desconhecido', 'error');
                        log('   → Verifique o console do navegador (F12)', 'warning');
                        updateStatus('❌ Erro desconhecido - Veja log acima', 'error');
                    }
                    updateChecklist('check-rules', false);
                }

            } catch (error) {
                log(`\n❌ Erro geral no diagnóstico:`, 'error');
                log(`   ${error.message}`, 'error');
                updateStatus('❌ Erro no diagnóstico', 'error');
            }
        }

        async function testReport() {
            clearLog();
            updateStatus('⏳ Testando criação de denúncia...', 'loading');
            log('=== TESTE DE DENÚNCIA ===', 'info');

            const user = auth.currentUser;
            if (!user) {
                log('❌ Você não está autenticado!', 'error');
                updateStatus('❌ Faça login primeiro', 'error');
                return;
            }

            const testData = {
                petId: `test-pet-${Date.now()}`,
                petName: 'Animal de Teste',
                reporterName: user.displayName || user.email,
                reporterEmail: user.email,
                motivo: 'Teste - Por favor, ignore',
                ownerIdentifier: 'usuario-teste'
            };

            log(`Criando denúncia com:`, 'info');
            log(`  petId: ${testData.petId}`, 'info');
            log(`  reporter: ${testData.reporterEmail}`, 'info');

            try {
                const id = await criarDenuncia(testData);
                log(`\n✅ SUCESSO! Denúncia criada com ID:`, 'success');
                log(`   ${id}`, 'success');
                log('\n🎉 Suas permissões estão corretas!', 'success');
                log('Você pode deletar este documento no Firebase Console se quiser.', 'info');
                updateStatus('✅ Denúncia criada com sucesso!', 'success');
            } catch (error) {
                log(`\n❌ ERRO:`, 'error');
                log(`Código: ${error.code}`, 'error');
                log(`Mensagem: ${error.message}`, 'error');

                if (error.message.includes('permission')) {
                    log('\n📋 SOLUÇÃO:', 'warning');
                    log('1. Abra Firebase Console: console.firebase.google.com', 'warning');
                    log('2. Vá para Firestore Database > Regras', 'warning');
                    log('3. Cole o conteúdo de CONFIGURACAO_FIREBASE.md', 'warning');
                    log('4. Clique "Publicar"', 'warning');
                    log('5. Aguarde 30 segundos', 'warning');
                    log('6. Recarregue esta página', 'warning');
                }

                updateStatus('❌ Erro - Veja solução no log', 'error');
            }
        }

        function checkFirebaseRules() {
            clearLog();
            log('=== INFORMAÇÕES SOBRE REGRAS ===', 'info');
            log('\n✓ As regras devem permitir:', 'info');
            log('  - Ler: apenas admins (isAdmin())', 'info');
            log('  - Criar: qualquer usuário autenticado', 'info');
            log('  - Atualizar: apenas admins', 'info');
            log('  - Deletar: apenas admins', 'info');
            log('\n📋 Regra para "create":', 'info');
            log('  allow create: if request.auth != null;', 'info');
            log('\n🌐 Vá para: Firebase Console > Firestore > Regras', 'info');
            log('   E procure por: match /reports/{reportId}', 'info');
        }

        function openFirebaseConsole() {
            window.open('https://console.firebase.google.com/project/ajudapet-2d3c6/firestore/rules', '_blank');
        }

        window.runDiagnostics = runDiagnostics;
        window.testReport = testReport;
        window.checkFirebaseRules = checkFirebaseRules;
        window.openFirebaseConsole = openFirebaseConsole;
        window.clearLog = clearLog;

        // Executar diagnóstico automaticamente ao carregar
        observeAuthState((user) => {
            if (user) {
                runDiagnostics();
            } else {
                updateStatus('⚠️ Você não está autenticado - Faça login primeiro', 'warning');
                clearLog();
                log('Você precisa fazer login antes de usar este diagnóstico', 'warning');
            }
        });
    </script>
</body>
</html>
