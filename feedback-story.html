<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F7F9FB">
    <meta name="description" content="Uma mensagem especial da comunidade AjudaPet.">
    <title>Uma mensagem especial | AjudaPet</title>
    <style>
        :root {
            color-scheme: light;
            font-family: 'Outfit', 'Segoe UI', sans-serif;
            color: #1A1A1A;
            background: #F7F9FB;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 20px 24px;
            background:
                radial-gradient(ellipse at 12% 15%, rgba(255, 107, 53, .14), transparent 32%),
                radial-gradient(ellipse at 88% 84%, rgba(0, 78, 100, .12), transparent 34%),
                #F7F9FB;
        }

        .story {
            position: relative;
            isolation: isolate;
            width: min(100%, 480px);
            min-height: min(800px, calc(100svh - 112px));
            aspect-ratio: 9 / 16;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: clamp(32px, 7vw, 62px) clamp(24px, 8vw, 56px);
            border: 1px solid rgba(255, 255, 255, .9);
            border-radius: 34px;
            background:
                radial-gradient(ellipse at 50% 4%, #FFFFFF, transparent 42%),
                linear-gradient(155deg, #FFFFFF 4%, #F7F9FB 100%);
            box-shadow: 0 32px 90px rgba(0, 78, 100, .16);
            text-align: center;
        }

        .story::before,
        .story::after {
            position: absolute;
            z-index: -1;
            width: 270px;
            height: 270px;
            border-radius: 50%;
            content: "";
            pointer-events: none;
        }

        .story::before {
            top: -164px;
            left: -116px;
            background: radial-gradient(
                circle,
                transparent 49.3%,
                rgba(255, 107, 53, .18) 49.6%,
                rgba(255, 107, 53, .18) 50%,
                transparent 50.3%,
                transparent 57.3%,
                rgba(255, 107, 53, .04) 57.6%,
                rgba(255, 107, 53, .04) 58%,
                transparent 58.3%,
                transparent 65.3%,
                rgba(255, 107, 53, .025) 65.6%,
                rgba(255, 107, 53, .025) 66%,
                transparent 66.3%
            );
        }

        .story::after {
            right: -166px;
            bottom: -148px;
            width: 320px;
            height: 320px;
            background: radial-gradient(
                circle,
                transparent 49.3%,
                rgba(0, 78, 100, .16) 49.6%,
                rgba(0, 78, 100, .16) 50%,
                transparent 50.3%,
                transparent 57%,
                rgba(0, 78, 100, .04) 57.3%,
                rgba(0, 78, 100, .04) 57.7%,
                transparent 58%,
                transparent 65%,
                rgba(0, 78, 100, .025) 65.3%,
                rgba(0, 78, 100, .025) 65.7%,
                transparent 66%
            );
        }

        .story-content {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: auto;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            color: #004E64;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: .055em;
        }

        .brand-name {
            color: #004E64;
            font-weight: 800;
        }

        .brand-name span {
            color: #FF6B35;
            font-weight: 800;
        }

        .brand-mark {
            width: 36px;
            height: 36px;
            display: grid;
            place-items: center;
            border-radius: 11px;
            background: #004E64;
            color: #FFFFFF;
            font-size: .72rem;
            letter-spacing: .03em;
        }

        .eyebrow {
            margin: 0 0 13px;
            color: #FF6B35;
            font-size: .7rem;
            font-weight: 800;
            letter-spacing: .2em;
            text-transform: uppercase;
        }

        h1 {
            max-width: 360px;
            margin: 0;
            color: #004E64;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2.3rem, 9vw, 3.65rem);
            font-weight: 500;
            letter-spacing: -.055em;
            line-height: 1.04;
            text-wrap: balance;
        }

        .intro {
            max-width: 310px;
            margin: 17px 0 29px;
            color: #666666;
            font-size: .97rem;
            line-height: 1.6;
        }

        .profile {
            width: min(100%, 358px);
            padding: 27px 25px 25px;
            border: 1px solid rgba(0, 78, 100, .12);
            border-radius: 28px;
            background: rgba(255, 255, 255, .94);
            box-shadow: 0 18px 48px rgba(0, 78, 100, .1);
            backdrop-filter: blur(12px);
        }

        .profile-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            text-align: left;
        }

        .avatar-wrap {
            width: 76px;
            height: 76px;
            flex: 0 0 76px;
            padding: 5px;
            border: 2px solid #FF6B35;
            border-radius: 50%;
            background: #FFFFFF;
        }

        .avatar {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 50%;
            background: #F7F9FB;
            object-fit: cover;
        }

        .name {
            margin: 0;
            color: #004E64;
            font-size: 1.06rem;
            font-weight: 750;
            overflow-wrap: anywhere;
        }

        .quote-mark {
            height: 41px;
            margin-top: 21px;
            color: #FF6B35;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 3.8rem;
            line-height: 1;
        }

        .message {
            margin: 1px 0 0;
            color: #1A1A1A;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(1.13rem, 4.4vw, 1.38rem);
            font-style: italic;
            line-height: 1.58;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .loading,
        .error {
            width: min(100%, 358px);
            padding: 22px;
            border-radius: 20px;
            background: rgba(255, 255, 255, .94);
            color: #666666;
            line-height: 1.6;
        }

        .error {
            border: 1px solid rgba(255, 107, 53, .35);
            color: #004E64;
        }

        .footer {
            margin-top: clamp(32px, 6vh, 54px);
            text-align: center;
        }

        .footer p {
            margin: 0 0 12px;
            color: #666666;
            font-size: .79rem;
            letter-spacing: .04em;
        }

        .download-button {
            display: inline-flex;
            min-height: 46px;
            align-items: center;
            justify-content: center;
            padding: 0 22px;
            border: 0;
            border-radius: 999px;
            background: #FF6B35;
            box-shadow: 0 8px 20px rgba(255, 107, 53, .2);
            color: #FFFFFF;
            cursor: pointer;
            font: inherit;
            font-size: .88rem;
            font-weight: 750;
            transition: transform .2s ease, background .2s ease;
        }

        .download-button:hover:not(:disabled) {
            transform: translateY(-2px);
            background: #004E64;
        }

        .download-button:disabled {
            cursor: wait;
            opacity: .72;
        }

        .download-status {
            min-height: 1.25em;
            margin: 0;
            color: #004E64;
            font-size: .85rem;
            text-align: center;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 520px) {
            body {
                justify-content: flex-start;
                gap: 12px;
                padding: 0 0 16px;
            }

            .story {
                width: 100%;
                min-height: calc(100vh - 82px);
                min-height: calc(100svh - 82px);
                border: 0;
                border-radius: 0;
                padding: 34px 25px;
            }
        }

        @media (max-height: 700px) {
            .story {
                padding-top: 24px;
                padding-bottom: 24px;
            }

            .brand {
                margin-bottom: 20px;
            }

            .intro {
                margin-top: 10px;
                margin-bottom: 17px;
            }

            .profile {
                padding: 18px 20px;
            }

            .footer {
                margin-top: 22px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::afte
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="story">
        <div class="story-content">
            <div class="brand" aria-label="AjudaPet">
                <span class="brand-name">Ajuda<span>Pet</span></span>
            </div>

            <p class="eyebrow">Uma voz da nossa comunidade</p>
            <h1>Palavras que fazem bem.</h1>
            <p class="intro">Cada gesto de carinho ajuda a transformar histórias. Olha só esta mensagem:</p>

            <div class="loading" id="loading" role="status">Carregando esta mensagem especial...</div>
            <section class="profile" id="feedback-card" aria-label="Feedback da comunidade" hidden>
                <div class="profile-header">
                    <div class="avatar-wrap">
                        <img class="avatar" id="profile-photo" src="./assets/images/usuario.png" alt="Foto de perfil">
                    </div>
                    <h2 class="name" id="profile-name"></h2>
                </div>
                <div class="quote-mark" aria-hidden="true">“</div>
                <p class="message" id="feedback-message"></p>
            </section>
            <p class="error" id="error-message" role="alert" hidden></p>

            <footer class="footer">
                <p>Adotar é um ato de amor.</p>
            </footer>
        </div>
    </main>
    <button class="download-button" id="download-button" type="button" disabled>Baixar Imagem</button>
    <p class="download-status" id="download-status" role="status" aria-live="polite"></p>
    <a href="./index.html">Voltar para a página inicial</a>

    <script type="module">
        import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { db } from './js/firebase-config.js';

        const story = document.querySelector('main.story');
        const loading = document.getElementById('loading');
        const card = document.getElementById('feedback-card');
        const errorMessage = document.getElementById('error-message');
        const profileName = document.getElementById('profile-name');
        const profilePhoto = document.getElementById('profile-photo');
        const feedbackMessage = document.getElementById('feedback-message');
        const downloadButton = document.getElementById('download-button');
        const downloadStatus = document.getElementById('download-status');
        let htmlToImagePromise;
        let profilePhotoReady = Promise.resolve(true);

        function loadHtmlToImage() {
            if (!htmlToImagePromise) {
                htmlToImagePromise = new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = 'https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.min.js';
                    script.crossOrigin = 'anonymous';
                    script.onload = () => {
                        if (typeof window.htmlToImage?.toBlob === 'function') {
                            resolve(window.htmlToImage);
                        } else {
                            reject(new Error('A biblioteca de imagem não foi inicializada.'));
                        }
                    };
                    script.onerror = () => reject(new Error('Não foi possível carregar a biblioteca de imagem.'));
                    document.head.append(script);
                }).catch((error) => {
                    htmlToImagePromise = null;
                    throw error;
                });
            }
            return htmlToImagePromise;
        }

        function readBlobAsDataUrl(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    if (typeof reader.result === 'string') {
                        resolve(reader.result);
                    } else {
                        reject(new Error('Não foi possível preparar a foto para a imagem.'));
                    }
                };
                reader.onerror = () => reject(reader.error || new Error('Não foi possível ler a foto do perfil.'));
                reader.readAsDataURL(blob);
            });
        }

        async function prepareProfilePhoto(source) {
            let imageSource = source;
            if (source.startsWith('data:image/')) {
                imageSource = source;
            } else {
                const response = await fetch(source, { mode: 'cors' });
                if (!response.ok) {
                    throw new Error(`A foto do perfil respondeu com o status ${response.status}.`);
                }
                const imageBlob = await response.blob();
                if (!imageBlob.type.startsWith('image/')) {
                    throw new Error('O arquivo do perfil não é uma imagem válida.');
                }
                imageSource = await readBlobAsDataUrl(imageBlob);
            }

            const image = new Image();
            image.src = imageSource;
            await image.decode();

            const canvas = document.createElement('canvas');
            canvas.width = image.naturalWidth;
            canvas.height = image.naturalHeight;
            const context = canvas.getContext('2d');
            if (!context) {
                throw new Error('Não foi possível preparar a foto de perfil para a imagem.');
            }

            context.drawImage(image, 0, 0);
            profilePhoto.src = canvas.toDataURL('image/png');
            await profilePhoto.decode();
        }

        async function downloadStoryImage() {
            downloadButton.disabled = true;
            downloadButton.textContent = 'Preparando imagem...';
            downloadStatus.textContent = '';

            try {
                await document.fonts.ready;
                if (!await profilePhotoReady) {
                    throw new Error('Não foi possível carregar a foto de perfil. Verifique se ela está acessível no perfil do usuário e tente novamente.');
                }
                await profilePhoto.decode();
                const htmlToImage = await loadHtmlToImage();
                const pixelRatio = Math.min(3, Math.max(2, 1080 / story.clientWidth));
                const canvas = await htmlToImage.toCanvas(story, {
                    pixelRatio,
                    cacheBust: true,
                    filter: (element) => !(
                        element instanceof HTMLElement
                        && element.matches('a, button')
                        && element.textContent.includes('Conheça o AjudaPet')
                    )
                });

                const storyRect = story.getBoundingClientRect();
                const photoRect = profilePhoto.getBoundingClientRect();
                const scaleX = canvas.width / storyRect.width;
                const scaleY = canvas.height / storyRect.height;
                const photoX = (photoRect.left - storyRect.left) * scaleX;
                const photoY = (photoRect.top - storyRect.top) * scaleY;
                const photoWidth = photoRect.width * scaleX;
                const photoHeight = photoRect.height * scaleY;
                const context = canvas.getContext('2d');
                if (!context) {
                    throw new Error('Não foi possível finalizar a imagem PNG.');
                }

                const sourceSize = Math.min(profilePhoto.naturalWidth, profilePhoto.naturalHeight);
                const sourceX = (profilePhoto.naturalWidth - sourceSize) / 2;
                const sourceY = (profilePhoto.naturalHeight - sourceSize) / 2;
                context.save();
                context.beginPath();
                context.arc(
                    photoX + photoWidth / 2,
                    photoY + photoHeight / 2,
                    Math.min(photoWidth, photoHeight) / 2,
                    0,
                    Math.PI * 2
                );
                context.clip();
                context.drawImage(
                    profilePhoto,
                    sourceX,
                    sourceY,
                    sourceSize,
                    sourceSize,
                    photoX,
                    photoY,
                    photoWidth,
                    photoHeight
                );
                context.restore();

                const blob = await new Promise((resolve, reject) => {
                    canvas.toBlob((result) => {
                        if (result) resolve(result);
                        else reject(new Error('O navegador não conseguiu gerar o arquivo PNG.'));
                    }, 'image/png');
                });
                if (!blob) {
                    throw new Error('A biblioteca não conseguiu gerar o arquivo PNG.');
                }

                const file = new File([blob], 'ajudapet-feedback.png', { type: 'image/png' });
                if (typeof navigator.share === 'function' && navigator.canShare?.({ files: [file] })) {
                    try {
                        downloadButton.textContent = 'Aguardando...';
                        await navigator.share({
                            files: [file],
                            title: 'Feedback da comunidade AjudaPet'
                        });
                        downloadStatus.textContent = 'Imagem compartilhada. Selecione Salvar imagem ou Fotos no menu do aparelho.';
                        return;
                    } catch (error) {
                        if (error.name === 'AbortError') {
                            downloadStatus.textContent = 'Compartilhamento cancelado.';
                            return;
                        }
                        console.error('O compartilhamento não está disponível; iniciando o download:', error);
                    }
                }

                const objectUrl = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = objectUrl;
                link.download = 'ajudapet-feedback.png';
                document.body.append(link);
                link.click();
                link.remove();
                window.setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
                downloadStatus.textContent = 'Imagem PNG baixada. Para salvar na galeria, abra o arquivo e escolha Salvar imagem.';
            } catch (error) {
                console.error('Não foi possível gerar a imagem do feedback:', error);
                downloadStatus.textContent = error instanceof Error
                    ? error.message
                    : 'Não foi possível gerar a imagem. Verifique sua conexão e tente novamente.';
            } finally {
                downloadButton.disabled = false;
                downloadButton.textContent = 'Baixar Imagem';
            }
        }

        downloadButton.addEventListener('click', () => {
            void downloadStoryImage();
        });

        function isSafePhotoUrl(value) {
            if (typeof value !== 'string') return false;
            if (/^data:image\/(?:jpeg|png|webp);base64,/i.test(value)) return true;

            try {
                const url = new URL(value);
                return url.protocol === 'https:'
                    && ['firebasestorage.googleapis.com', 'storage.googleapis.com'].includes(url.hostname);
            } catch {
                return false;
            }
        }

        function showError(message) {
            loading.hidden = true;
            errorMessage.textContent = message;
            errorMessage.hidden = false;
        }

        async function loadStory() {
            const params = new URLSearchParams(window.location.search);
            const uid = params.get('uid') || '';
            const feedbackId = params.get('feedbackId') || '';
            const safeIdPattern = /^[A-Za-z0-9_-]+$/;

            if (!safeIdPattern.test(uid) || !safeIdPattern.test(feedbackId)) {
                showError('Este link está incompleto ou inválido. Peça um novo link de divulgação.');
                return;
            }

            try {
                const shareSnapshot = await getDoc(doc(db, 'feedbackShares', feedbackId));
                if (!shareSnapshot.exists()) {
                    showError('Não encontramos esta mensagem. Confira se o link está correto.');
                    return;
                }

                const share = shareSnapshot.data();
                if (share.uid !== uid || typeof share.message !== 'string' || !share.message.trim()) {
                    showError('Não encontramos esta mensagem para o perfil informado.');
                    return;
                }

                let name = typeof share.displayName === 'string' ? share.displayName.trim() : '';
                let photoUrl = share.avatarData || share.avatarUrl || '';
                try {
                    const profileSnapshot = await getDoc(doc(db, 'users', uid));
                    if (profileSnapshot.exists()) {
                        const profile = profileSnapshot.data();
                        name = (typeof profile.displayName === 'string' && profile.displayName.trim())
                            || (typeof profile.name === 'string' && profile.name.trim())
                            || name;
                        photoUrl = profile.avatarData
                            || profile.avatarUrl
                            || profile.photoURL
                            || profile.photoUrl
                            || photoUrl;
                    }
                } catch (error) {
                    console.error('Não foi possível carregar a foto do perfil:', error);
                }

                profileName.textContent = name || 'Pessoa da comunidade AjudaPet';
                feedbackMessage.textContent = share.message.trim();
                const imageSource = isSafePhotoUrl(photoUrl) ? photoUrl : profilePhoto.src;
                profilePhotoReady = prepareProfilePhoto(imageSource).then(() => true).catch((error) => {
                    console.error('Não foi possível preparar a foto de perfil para a imagem:', error);
                    return false;
                });
                card.hidden = false;
                loading.hidden = true;
                downloadButton.disabled = false;
            } catch (error) {
                console.error('Não foi possível carregar o feedback compartilhado:', error);
                showError('Não foi possível carregar esta mensagem agora. Tente novamente mais tarde.');
            }
        }

        profilePhoto.addEventListener('error', () => {
            profilePhoto.src = './assets/images/usuario.png';
        }, { once: true });

        void loadStory();
    </script>
</body>
</html>
